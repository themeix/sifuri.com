<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

{% capture page_title %}
  {% if page.title and page.url != "/" %}
    {{ page.title }} – {{ site.title }}
  {% else %}
    {{ site.title }} – {{ site.tagline }}
  {% endif %}
{% endcapture %}
<title>{{ page_title | strip }}</title>

<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Favicon -->
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">

<!-- Google Fonts: Work Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!-- Tailwind CSS Main Output -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- Feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} » Feed" href="{{ '/feed.xml' | absolute_url }}">

<!-- LLM / AI Search Discovery (GEO/AEO) -->
<link rel="help" type="text/markdown" href="{{ '/llms.txt' | absolute_url }}" title="LLM Context">
<link rel="help" type="text/markdown" href="{{ '/llms-full.txt' | absolute_url }}" title="Full LLM Context">

<!-- Open Graph / SEO -->
<meta property="og:locale" content="en_US">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
